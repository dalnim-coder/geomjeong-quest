<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>이음 영어단어 메모리 🧠</title>
<style>
  :root{
    --green:#58cc02; --green-d:#4aa802; --green-l:#d7ffb8;
    --red:#ff4b4b; --red-l:#ffdfe0;
    --blue:#1cb0f6; --blue-d:#1899d6; --blue-l:#e6f6ff;
    --purple:#a560ff; --purple-d:#8a3ffb;
    --orange:#ff8f00; --orange-d:#e07b00;
    --gray:#e5e5e5; --gray-d:#afafaf;
    --ink:#3c3c3c; --gold:#ffc800;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  body{
    font-family:'Segoe UI','Malgun Gothic',system-ui,sans-serif;
    background:#fff; color:var(--ink);
    display:flex; justify-content:center; min-height:100vh;
    -webkit-user-select:none; user-select:none;
  }
  #app{width:100%; max-width:480px; display:flex; flex-direction:column; min-height:100vh; padding:14px;}

  .btn{
    border:none; border-radius:16px; font-size:18px; font-weight:800;
    padding:15px; cursor:pointer; width:100%;
    box-shadow:0 4px 0 rgba(0,0,0,.18); transition:transform .05s, box-shadow .05s;
    letter-spacing:.5px;
  }
  .btn:active{transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.18);}
  .btn-green{background:var(--green); color:#fff;}
  .btn-blue{background:var(--blue); color:#fff;}
  .btn-gray{background:#fff; color:var(--ink); border:2px solid var(--gray); box-shadow:0 4px 0 var(--gray);}

  .hide{display:none !important;}

  /* ===== 시작화면 ===== */
  #start{flex:1; display:flex; flex-direction:column; align-items:center; gap:14px; text-align:center; padding-top:14px;}
  #start .cap{font-size:64px; animation:bob 2s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  #start h1{font-size:26px; color:var(--blue-d);}
  #start .sub{color:var(--gray-d); font-size:13px; line-height:1.5;}
  .chips{display:flex; gap:8px; flex-wrap:wrap; justify-content:center;}
  .chip{background:#fff7e0; border:2px solid var(--gold); border-radius:14px; padding:7px 12px; font-weight:800; font-size:13px;}
  .chip.star{background:#e6f6ff; border-color:var(--blue);}

  /* 단계 리스트 */
  #stageList{width:100%; display:flex; flex-direction:column; gap:10px; margin-top:4px; padding-bottom:20px;}
  .stage{
    display:flex; align-items:center; gap:12px; text-align:left;
    background:#fff; border:2px solid var(--gray); border-radius:18px;
    padding:12px 14px; box-shadow:0 4px 0 var(--gray); cursor:pointer;
    transition:transform .05s, box-shadow .05s;
  }
  .stage:active{transform:translateY(3px); box-shadow:0 1px 0 var(--gray);}
  .stage.done{border-color:var(--green); box-shadow:0 4px 0 var(--green-l); background:#f6ffee;}
  .stage.locked{opacity:.45; cursor:default; box-shadow:0 4px 0 var(--gray);}
  .stage .no{
    width:40px; height:40px; flex:0 0 40px; border-radius:50%;
    background:var(--blue); color:#fff; font-weight:900; font-size:17px;
    display:flex; align-items:center; justify-content:center;
  }
  .stage.done .no{background:var(--green);}
  .stage.locked .no{background:var(--gray-d);}
  .stage .info{flex:1; min-width:0;}
  .stage .tt{font-weight:800; font-size:16px;}
  .stage .dd{font-size:12px; color:var(--gray-d); margin-top:2px;}
  .stage .stars{font-size:14px; letter-spacing:1px; white-space:nowrap;}

  /* ===== 게임 화면 ===== */
  #game{flex:1; display:flex; flex-direction:column;}
  .top{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .back{background:none; border:none; font-size:26px; color:var(--gray-d); cursor:pointer; padding:0 4px;}
  .bar{flex:1; height:16px; background:var(--gray); border-radius:10px; overflow:hidden;}
  .bar>i{display:block; height:100%; width:0; background:var(--green); border-radius:10px; transition:width .3s;}
  .sound{background:none; border:none; font-size:22px; cursor:pointer;}
  .meta{display:flex; justify-content:space-between; font-size:13px; font-weight:800; color:var(--gray-d); margin-bottom:10px;}
  .meta .stg{color:var(--blue-d);}

  #board{
    flex:1; display:grid; gap:8px; align-content:center;
    grid-template-columns:repeat(4,1fr);
  }
  .card{position:relative; aspect-ratio:3/4; perspective:600px; cursor:pointer;}
  .card .inner{
    position:absolute; inset:0; transition:transform .35s;
    transform-style:preserve-3d;
  }
  .card.open .inner, .card.matched .inner{transform:rotateY(180deg);}
  .face{
    position:absolute; inset:0; border-radius:14px;
    display:flex; align-items:center; justify-content:center; text-align:center;
    backface-visibility:hidden; -webkit-backface-visibility:hidden;
    padding:4px; font-weight:800; line-height:1.15; word-break:break-word;
    overflow:hidden;
  }
  .back-f{
    background:linear-gradient(145deg,var(--blue),var(--purple)); color:#fff; font-size:24px;
    box-shadow:0 4px 0 rgba(0,0,0,.15);
  }
  .front-f{
    transform:rotateY(180deg); background:#fff; border:3px solid var(--blue);
    color:var(--ink); box-shadow:0 4px 0 var(--blue-l);
  }
  .front-f.ko{border-color:var(--orange); box-shadow:0 4px 0 #ffe6bf;}
  .card.matched .front-f{border-color:var(--green); background:var(--green-l); box-shadow:0 4px 0 #bdf08a;}
  .card.matched{animation:pop .35s;}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.12)}100%{transform:scale(1)}}
  .card.wrong .front-f{border-color:var(--red); background:var(--red-l); animation:shake .3s;}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

  /* 발음 안내 배너 */
  #say{
    margin-top:10px; min-height:52px; border-radius:16px; padding:8px 12px;
    display:flex; align-items:center; justify-content:center; gap:10px;
    background:var(--green-l); color:var(--green-d); font-weight:800; font-size:16px;
    opacity:0; transition:opacity .2s;
  }
  #say.on{opacity:1;}
  #say .en{font-size:19px;}
  #say .sp{font-size:13px; color:#6a9c33;}
  #say.warn{background:#fff0d9; color:var(--orange-d); flex-direction:column; gap:2px;}
  #say.warn .en{font-size:15px;}
  #say.warn .sp{font-size:12px; color:var(--orange-d);}

  /* 브라우저 안내 배너 */
  #browserWarn{
    width:100%; background:#fff0d9; border:2px solid var(--orange);
    border-radius:16px; padding:12px 14px; text-align:left;
    display:flex; flex-direction:column; gap:8px;
  }
  #browserWarn .t{font-weight:900; font-size:15px; color:var(--orange-d);}
  #browserWarn .d{font-size:12.5px; color:var(--ink); line-height:1.5;}
  #browserWarn a{
    display:block; text-align:center; text-decoration:none;
    background:var(--orange); color:#fff; font-weight:900; font-size:15px;
    padding:11px; border-radius:14px; box-shadow:0 3px 0 rgba(0,0,0,.15);
  }
  #browserWarn a:active{transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,.15);}

  /* 발음 테스트 */
  .tts-test{
    background:none; border:none; color:var(--gray-d); font-size:13px;
    text-decoration:underline; cursor:pointer; padding:6px; font-weight:700;
  }
  #ttsOut{font-size:12px; color:var(--gray-d); line-height:1.5; padding:0 8px; white-space:pre-line;}
  #ttsOut.bad{color:var(--red); font-weight:800;}
  #ttsOut.good{color:var(--green-d); font-weight:800;}

  /* ===== 불꽃 이펙트 ===== */
  #fx{position:fixed; inset:0; pointer-events:none; z-index:900;}
  #combo{
    position:fixed; left:50%; top:36%; z-index:950; pointer-events:none;
    opacity:0; text-align:center; white-space:nowrap;
    transform:translate(-50%,-50%);
  }
  #combo.on{animation:comboPop 1.2s ease-out;}
  @keyframes comboPop{
    0%  {opacity:0; transform:translate(-50%,-50%) scale(.3) rotate(-10deg);}
    22% {opacity:1; transform:translate(-50%,-50%) scale(1.18) rotate(3deg);}
    40% {opacity:1; transform:translate(-50%,-50%) scale(1) rotate(0deg);}
    78% {opacity:1; transform:translate(-50%,-56%) scale(1);}
    100%{opacity:0; transform:translate(-50%,-78%) scale(1.05);}
  }
  #combo .n{
    font-size:50px; font-weight:900; letter-spacing:1px;
    color:var(--gold); -webkit-text-stroke:3px #fff;
    paint-order:stroke fill;
    text-shadow:0 4px 0 rgba(0,0,0,.18);
  }
  #combo .t{
    margin-top:2px; font-size:19px; font-weight:900; color:#fff;
    background:var(--orange); border-radius:20px; padding:5px 16px;
    display:inline-block; box-shadow:0 4px 0 rgba(0,0,0,.15);
  }
  #combo.lv2 .n{color:#ff8f00;}
  #combo.lv3 .n{color:#ff4b4b; font-size:58px;}
  #combo.lv3 .t{background:var(--red);}

  /* ===== 결과 ===== */
  #result{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:14px;}
  #result .emo{font-size:72px;}
  #result h2{font-size:24px; color:var(--green-d);}
  #result .bigstars{font-size:38px; letter-spacing:4px;}
  #result .msg{font-size:15px; color:var(--gray-d); line-height:1.6; padding:0 10px; white-space:pre-line;}
  .wordlist{width:100%; display:flex; flex-direction:column; gap:6px; max-height:38vh; overflow-y:auto; padding:2px;}
  .wrow{
    display:flex; align-items:center; gap:10px; background:#f7fbff;
    border:2px solid var(--blue-l); border-radius:12px; padding:9px 12px; cursor:pointer;
  }
  .wrow:active{background:var(--blue-l);}
  .wrow .we{font-weight:900; font-size:16px; color:var(--blue-d);}
  .wrow .wk{flex:1; text-align:right; font-size:14px; color:var(--ink);}
  .wrow .ws{font-size:16px;}
  .rowbtns{display:flex; gap:10px; width:100%;}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div id="combo"><div class="n"></div><div><span class="t"></span></div></div>
<div id="app">

  <!-- 시작 -->
  <div id="start">
    <div class="cap">🧠</div>
    <h1>이음 영어단어 메모리</h1>
    <div class="sub">같은 뜻 카드 두 장을 찾으면<br>발음이 나와! 10단계 도전 🎧</div>
    <div class="chips">
      <div class="chip" id="chipStar">⭐ 0 / 30</div>
      <div class="chip star" id="chipWord">📘 0 단어</div>
    </div>
    <div id="browserWarn" class="hide">
      <div class="t">🔇 이 브라우저는 발음이 안 나와</div>
      <div class="d">삼성 인터넷은 영어 읽어주기 기능이 없어.<br><b>크롬</b>으로 열면 발음이 나와!</div>
      <a id="openChrome" href="#">크롬으로 열기 →</a>
    </div>
    <button class="tts-test" onclick="testTTS()">🔊 발음 테스트</button>
    <div id="ttsOut"></div>
    <div id="stageList"></div>
  </div>

  <!-- 게임 -->
  <div id="game" class="hide">
    <div class="top">
      <button class="back" onclick="goHome()">←</button>
      <div class="bar"><i id="barFill"></i></div>
      <button class="sound" id="sndBtn" onclick="toggleSound()">🔊</button>
    </div>
    <div class="meta">
      <span class="stg" id="stgName">1단계</span>
      <span id="tryTxt">뒤집기 0</span>
    </div>
    <div id="board"></div>
    <div id="say"><span class="en"></span><span class="sp"></span></div>
  </div>

  <!-- 결과 -->
  <div id="result" class="hide">
    <div class="emo">🎉</div>
    <h2 id="rTitle">단계 클리어!</h2>
    <div class="bigstars" id="rStars">⭐⭐⭐</div>
    <div class="msg" id="rMsg"></div>
    <div class="wordlist" id="rWords"></div>
    <div class="rowbtns">
      <button class="btn btn-gray" onclick="goHome()">단계 목록</button>
      <button class="btn btn-green" id="nextBtn" onclick="nextStage()">다음 단계 →</button>
    </div>
  </div>

</div>

<script>
/* ================= 단어 데이터 (중졸 검정고시 빈출) ================= */
const STAGES = [
  { name:"학교와 일상", emoji:"🏫", words:[
    ["school","학교"],["book","책"],["friend","친구"],["water","물"]
  ]},
  { name:"기본 동작", emoji:"🏃", words:[
    ["eat","먹다"],["run","달리다"],["study","공부하다"],["sleep","자다"]
  ]},
  { name:"사람과 직업", emoji:"👨‍👩‍👧", words:[
    ["family","가족"],["parent","부모"],["teacher","선생님"],["doctor","의사"],["student","학생"]
  ]},
  { name:"기분·상태", emoji:"😊", words:[
    ["happy","행복한"],["sad","슬픈"],["angry","화난"],["tired","피곤한"],["hungry","배고픈"]
  ]},
  { name:"시간·날짜", emoji:"⏰", words:[
    ["morning","아침"],["evening","저녁"],["today","오늘"],["tomorrow","내일"],["week","주, 일주일"],["month","달, 개월"]
  ]},
  { name:"장소", emoji:"🏥", words:[
    ["library","도서관"],["hospital","병원"],["market","시장"],["station","역, 정거장"],["restaurant","식당"],["museum","박물관"]
  ]},
  { name:"생활 동사", emoji:"🛒", words:[
    ["buy","사다"],["sell","팔다"],["borrow","빌리다"],["return","돌려주다"],["invite","초대하다"],["visit","방문하다"]
  ]},
  { name:"자주 나오는 형용사", emoji:"⭐", words:[
    ["important","중요한"],["difficult","어려운"],["easy","쉬운"],["expensive","비싼"],["cheap","값싼"],["famous","유명한"],["dangerous","위험한"]
  ]},
  { name:"시험 단골 명사", emoji:"🌏", words:[
    ["health","건강"],["environment","환경"],["culture","문화"],["exercise","운동"],["hobby","취미"],["future","미래"],["problem","문제"]
  ]},
  { name:"고난도 동사", emoji:"🔥", words:[
    ["improve","향상시키다"],["protect","보호하다"],["reduce","줄이다"],["decide","결정하다"],["prepare","준비하다"],["understand","이해하다"],["introduce","소개하다"],["recommend","추천하다"]
  ]}
];

const CHEER_GOOD = [
  "완벽해! 애니고 가는 길, 착착 밟는 중 🎨",
  "기억력 미쳤다 진짜 👏",
  "이 정도면 8월 시험 영어는 문제없어!",
  "한 번도 안 헤맸네. 대단해 이음아 ✨"
];
const CHEER_OK = [
  "좋아! 한 번 더 하면 별 3개도 금방이야",
  "틀린 건 기억에 더 오래 남아. 잘하고 있어!",
  "차근차근 가자. 이 속도면 충분해 👍",
  "단어가 눈에 붙기 시작했네!"
];

/* ================= 상태 ================= */
const KEY = "ieum_memory_v1";
let save = loadSave();
let sound = true;
let cur = 0, deck = [], opened = [], tries = 0, matched = 0, lock = false;
let combo = 0, bestCombo = 0;

function loadSave(){
  try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s && s.stars) return s; }catch(e){}
  return { stars:{}, cleared:[] };
}
function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(save)); }catch(e){} }

/* ================= 소리 ================= */
let actx = null;
function ac(){
  if(!actx){
    try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; }
  }
  if(actx.state === "suspended"){ try{ actx.resume(); }catch(e){} }
  return actx;
}
function beep(freq, dur, type, vol, slideTo){
  if(!sound) return;
  const a = ac(); if(!a) return;
  try{
    const t = a.currentTime;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, t);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(vol == null ? .22 : vol, t);
    g.gain.exponentialRampToValueAtTime(.0008, t + dur);
    o.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t + dur + .02);
  }catch(e){}
}
/* 카드 뒤집는 '톡' 소리 — 첫 장/둘째 장 음이 다름 */
function sfxFlip(second){
  beep(second ? 700 : 520, .09, "triangle", .3, second ? 940 : 700);
  beep(second ? 1400 : 1040, .05, "sine", .1);
}
/* 정답 — 콤보가 오를수록 음계가 위로 */
const SCALE = [523,587,659,784,880,988,1175,1319,1568];
function sfxOK(c){
  const b = SCALE[Math.min(c, SCALE.length-1)];
  beep(b, .13, "sine", .25);
  setTimeout(()=>beep(b*1.5, .16, "sine", .2), 85);
  if(c >= 2){ setTimeout(()=>beep(b*2, .2, "triangle", .16), 170); }
  if(c >= 4){ setTimeout(()=>beep(b*2.5, .24, "triangle", .14), 255); }
}
function sfxNo(){ beep(240,.2,"square",.16,140); }
function sfxClear(){ [523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>beep(f,.22,"triangle",.2),i*110)); }
/* 폭죽 터지는 '펑' */
function sfxBoom(){
  if(!sound) return;
  const a = ac(); if(!a) return;
  try{
    const t = a.currentTime, len = 0.35, buf = a.createBuffer(1, a.sampleRate*len, a.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<d.length;i++){ d[i] = (Math.random()*2-1) * Math.pow(1 - i/d.length, 3); }
    const src = a.createBufferSource(); src.buffer = buf;
    const f = a.createBiquadFilter(); f.type = "lowpass"; f.frequency.setValueAtTime(1800, t);
    f.frequency.exponentialRampToValueAtTime(200, t + len);
    const g = a.createGain(); g.gain.setValueAtTime(.35, t);
    g.gain.exponentialRampToValueAtTime(.001, t + len);
    src.connect(f); f.connect(g); g.connect(a.destination);
    src.start(t);
  }catch(e){}
}

/* 영어 발음 (브라우저 TTS) */
let enVoice = null, enVoices = [], ttsWorked = false, ttsWarned = false;

function pickVoice(){
  if(!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices() || [];
  enVoices = vs.filter(v => /^en([-_]|$)/i.test(v.lang));
  enVoice = enVoices.find(v => /en[-_]US/i.test(v.lang) && /google/i.test(v.name))
         || enVoices.find(v => /en[-_]US/i.test(v.lang))
         || enVoices.find(v => /en[-_]GB/i.test(v.lang))
         || enVoices[0] || null;
}
if('speechSynthesis' in window){
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
  // 안드로이드는 음성 목록이 늦게 채워짐 → 몇 번 더 확인
  [300, 900, 2000].forEach(t => setTimeout(pickVoice, t));
}

function speak(word, rate){
  if(!sound || !('speechSynthesis' in window)) return;
  const s = window.speechSynthesis;
  try{
    s.cancel();
    // 안드로이드 크롬: cancel() 직후 speak()는 씹히는 버그가 있어 한 틱 뒤에 호출
    setTimeout(()=>{
      try{
        if(!enVoice) pickVoice();
        const u = new SpeechSynthesisUtterance(word);
        u.lang = (enVoice && enVoice.lang) || "en-US";
        u.rate = rate || .85; u.pitch = 1; u.volume = 1;
        if(enVoice) u.voice = enVoice;
        let started = false;
        u.onstart = ()=>{ started = true; ttsWorked = true; };
        u.onerror = ()=>{ if(!ttsWorked) warnTTS(); };
        s.speak(u);
        setTimeout(()=>{ if(!started && !ttsWorked) warnTTS(); }, 1500);
      }catch(e){}
    }, 60);
  }catch(e){}
}

/* 발음이 한 번도 안 나오면 딱 한 번 안내 */
function warnTTS(){
  if(ttsWarned) return;
  ttsWarned = true;
  const box = document.getElementById("say");
  box.classList.add("on", "warn");
  box.querySelector(".en").textContent = "🔇 이 폰은 영어 발음이 꺼져 있어";
  box.querySelector(".sp").textContent = " 설정 → 접근성 → 텍스트 음성 변환 → 영어 설치";
}
function warmup(){ // 모바일: 첫 사용자 터치에서 오디오 깨우기
  ac();
  try{
    if('speechSynthesis' in window){
      speechSynthesis.resume();   // 안드로이드에서 큐가 멈춰 있는 경우 대비
      pickVoice();
    }
  }catch(e){}
}
/* capture 단계로 등록 → 카드 클릭 핸들러보다 먼저 실행돼서 첫 소리부터 들림 */
document.addEventListener("touchstart", warmup, {once:true, capture:true});
document.addEventListener("mousedown", warmup, {once:true, capture:true});
document.addEventListener("click", warmup, {once:true, capture:true});

/* ================= 불꽃 이펙트 ================= */
const fxc = document.getElementById("fx");
const fctx = fxc.getContext("2d");
let parts = [], raf = null;

function sizeFx(){
  const r = window.devicePixelRatio || 1;
  fxc.width = innerWidth * r; fxc.height = innerHeight * r;
  fxc.style.width = innerWidth + "px"; fxc.style.height = innerHeight + "px";
  fctx.setTransform(r, 0, 0, r, 0, 0);
}
sizeFx();
window.addEventListener("resize", sizeFx);

const PAL = [
  ["#ffc800","#ff8f00","#fff3c0","#ffe27a"],                      // lv0 기본 금색
  ["#58cc02","#1cb0f6","#ffc800","#ffffff","#a560ff"],            // lv1 알록달록
  ["#ff4b4b","#ffc800","#1cb0f6","#a560ff","#58cc02","#ffffff"]   // lv2 풀컬러
];

function star(x, y, r){
  fctx.beginPath();
  for(let i=0;i<10;i++){
    const rad = (i % 2 === 0) ? r : r * .45;
    const a = Math.PI * i / 5 - Math.PI/2;
    const px = x + Math.cos(a)*rad, py = y + Math.sin(a)*rad;
    i === 0 ? fctx.moveTo(px,py) : fctx.lineTo(px,py);
  }
  fctx.closePath(); fctx.fill();
}

function burst(x, y, level){
  const lv = Math.min(level, 2);
  const n   = [26, 46, 78][lv];
  const spd = [5, 7, 10][lv];
  const pal = PAL[lv];
  for(let i=0;i<n;i++){
    const a = Math.random() * Math.PI * 2;
    const v = spd * (.35 + Math.random() * .9);
    parts.push({
      x, y,
      vx: Math.cos(a) * v,
      vy: Math.sin(a) * v - 1.6,
      life: 1, decay: .011 + Math.random() * .015,
      size: 2 + Math.random() * (2.5 + lv * 1.8),
      c: pal[(Math.random() * pal.length) | 0],
      st: lv >= 1 && Math.random() < .38,
      spin: Math.random() * 6
    });
  }
  if(!raf) raf = requestAnimationFrame(tickFx);
}

/* 3콤보 이상: 화면 위쪽에서 폭죽 여러 발 */
function fireworks(level){
  const shots = Math.min(2 + level, 6);
  for(let i=0;i<shots;i++){
    setTimeout(()=>{
      burst(innerWidth * (.12 + Math.random() * .76), innerHeight * (.12 + Math.random() * .35), 2);
      sfxBoom();
    }, i * 190);
  }
}

function tickFx(){
  fctx.clearRect(0, 0, innerWidth, innerHeight);
  for(let i = parts.length - 1; i >= 0; i--){
    const p = parts[i];
    p.x += p.vx; p.y += p.vy;
    p.vy += .2; p.vx *= .985; p.vy *= .985;
    p.life -= p.decay; p.spin += .2;
    if(p.life <= 0){ parts.splice(i, 1); continue; }
    fctx.globalAlpha = Math.max(p.life, 0);
    fctx.fillStyle = p.c;
    if(p.st){ star(p.x, p.y, p.size * 1.7); }
    else { fctx.beginPath(); fctx.arc(p.x, p.y, p.size, 0, 6.3); fctx.fill(); }
  }
  fctx.globalAlpha = 1;
  if(parts.length){ raf = requestAnimationFrame(tickFx); }
  else { raf = null; fctx.clearRect(0, 0, innerWidth, innerHeight); }
}

/* 콤보 배너 */
const COMBO_TXT = [
  "좋아! 👍", "잘한다! ✨", "연속 정답! 🔥", "폭발한다! 💥",
  "천재냐 진짜 🤯", "멈추지 마! 🚀", "이음이 최고! 👑"
];
function showCombo(c){
  const el = document.getElementById("combo");
  const lv = c >= 5 ? 3 : (c >= 3 ? 2 : 1);
  el.className = "";
  void el.offsetWidth;                                  // 애니메이션 리셋
  el.querySelector(".n").textContent = c + " COMBO";
  el.querySelector(".t").textContent = COMBO_TXT[Math.min(c - 2, COMBO_TXT.length - 1)];
  el.className = "on lv" + lv;
}

function toggleSound(){
  sound = !sound;
  document.getElementById("sndBtn").textContent = sound ? "🔊" : "🔇";
  if(!sound && 'speechSynthesis' in window) speechSynthesis.cancel();
}

/* ================= 시작화면 ================= */
function renderHome(){
  show("start");
  const list = document.getElementById("stageList");
  list.innerHTML = "";
  let totStar = 0, totWord = 0;
  STAGES.forEach((s,i)=>{
    const st = save.stars[i] || 0;
    totStar += st;
    if(st > 0) totWord += s.words.length;
    const unlocked = (i === 0) || (save.stars[i-1] > 0);
    const el = document.createElement("div");
    el.className = "stage" + (st>0 ? " done" : "") + (unlocked ? "" : " locked");
    el.innerHTML =
      '<div class="no">'+(unlocked ? (i+1) : "🔒")+'</div>'+
      '<div class="info">'+
        '<div class="tt">'+s.emoji+' '+s.name+'</div>'+
        '<div class="dd">'+s.words.length+'쌍 · 카드 '+(s.words.length*2)+'장</div>'+
      '</div>'+
      '<div class="stars">'+(st>0 ? "⭐".repeat(st)+"☆".repeat(3-st) : (unlocked?"☆☆☆":""))+'</div>';
    if(unlocked) el.onclick = ()=>startStage(i);
    list.appendChild(el);
  });
  document.getElementById("chipStar").textContent = "⭐ "+totStar+" / 30";
  document.getElementById("chipWord").textContent = "📘 "+totWord+" 단어";
  checkBrowser();
}

function show(id){
  ["start","game","result"].forEach(x=>{
    document.getElementById(x).classList.toggle("hide", x !== id);
  });
}
function goHome(){
  if('speechSynthesis' in window) speechSynthesis.cancel();
  parts = []; fctx.clearRect(0, 0, innerWidth, innerHeight);
  document.getElementById("combo").className = "";
  renderHome();
}

/* ================= 게임 ================= */
function startStage(i){
  cur = i; tries = 0; matched = 0; opened = []; lock = false;
  combo = 0; bestCombo = 0;
  parts = []; fctx.clearRect(0, 0, innerWidth, innerHeight);
  document.getElementById("combo").className = "";
  const s = STAGES[i];
  deck = [];
  s.words.forEach((w,idx)=>{
    deck.push({id:idx, type:"en", txt:w[0], en:w[0]});
    deck.push({id:idx, type:"ko", txt:w[1], en:w[0]});
  });
  shuffle(deck);

  document.getElementById("stgName").textContent = (i+1)+"단계 · "+s.name;
  document.getElementById("tryTxt").textContent = "뒤집기 0";
  document.getElementById("barFill").style.width = "0%";
  document.getElementById("say").classList.remove("on");

  const board = document.getElementById("board");
  board.innerHTML = "";
  deck.forEach((c,idx)=>{
    const el = document.createElement("div");
    el.className = "card";
    el.dataset.i = idx;
    const size = c.type === "en" ? fontFor(c.txt, 17) : fontFor(c.txt, 15);
    el.innerHTML =
      '<div class="inner">'+
        '<div class="face back-f">?</div>'+
        '<div class="face front-f '+(c.type==="ko"?"ko":"")+'" style="font-size:'+size+'px">'+c.txt+'</div>'+
      '</div>';
    el.onclick = ()=>flip(idx, el);
    board.appendChild(el);
  });
  show("game");
}

function fontFor(t, base){
  const n = t.length;
  if(n <= 5) return base;
  if(n <= 8) return base - 2;
  if(n <= 11) return base - 4;
  return base - 6;
}

function shuffle(a){
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
}

function centerOf(el){
  const r = el.getBoundingClientRect();
  return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
}

function flip(idx, el){
  if(lock) return;
  if(el.classList.contains("open") || el.classList.contains("matched")) return;
  el.classList.add("open");
  opened.push({idx, el, card:deck[idx]});
  sfxFlip(opened.length === 2);          // ← 뒤집을 때마다 소리

  if(opened.length === 2){
    tries++;
    document.getElementById("tryTxt").textContent = "뒤집기 " + tries;
    const [a,b] = opened;
    if(a.card.id === b.card.id){
      lock = true;
      setTimeout(()=>{
        a.el.classList.remove("open"); b.el.classList.remove("open");
        a.el.classList.add("matched"); b.el.classList.add("matched");
        matched++;
        combo++;
        if(combo > bestCombo) bestCombo = combo;

        const lv = combo >= 5 ? 2 : (combo >= 3 ? 1 : 0);
        const p1 = centerOf(a.el), p2 = centerOf(b.el);
        burst(p1.x, p1.y, lv);                                  // ← 두 카드에서 불꽃
        burst(p2.x, p2.y, lv);
        burst((p1.x + p2.x) / 2, (p1.y + p2.y) / 2, lv);        // 가운데서 한 번 더
        sfxOK(combo - 1);
        if(combo >= 2) showCombo(combo);                        // 연속이면 칭찬 배너
        if(combo >= 3) fireworks(lv);                           // 3연속부터 폭죽

        speak(a.card.en);                                       // ← 맞히면 발음!
        showSay(a.card.en, a.card.type === "en" ? b.card.txt : a.card.txt);
        const total = STAGES[cur].words.length;
        document.getElementById("barFill").style.width = (matched/total*100)+"%";
        opened = []; lock = false;
        if(matched === total) setTimeout(finish, combo >= 3 ? 1500 : 1100);
      }, 380);
    }else{
      lock = true;
      combo = 0;                                                // 틀리면 콤보 끊김
      a.el.classList.add("wrong"); b.el.classList.add("wrong");
      sfxNo();
      setTimeout(()=>{
        a.el.classList.remove("open","wrong"); b.el.classList.remove("open","wrong");
        opened = []; lock = false;
      }, 750);
    }
  }
}

/* ===== 발음 안 되는 브라우저(삼성 인터넷 등) 감지 → 크롬으로 유도 ===== */
function checkBrowser(){
  const ua = navigator.userAgent;
  const isSamsung = /SamsungBrowser/i.test(ua);
  const isAndroid = /Android/i.test(ua);
  const noTTS = !('speechSynthesis' in window);
  // 삼성 인터넷이거나, TTS 자체가 없거나, 안드로이드인데 영어 음성이 하나도 없을 때
  const bad = isSamsung || noTTS || (isAndroid && enVoices.length === 0 && !ttsWorked);
  const box = document.getElementById("browserWarn");
  box.classList.toggle("hide", !bad);

  if(bad && isAndroid && location.protocol.startsWith("http")){
    const link = document.getElementById("openChrome");
    const bare = location.href.replace(/^https?:\/\//, "");
    link.href = "intent://" + bare + "#Intent;scheme=https;package=com.android.chrome;end";
  }else if(bad){
    document.getElementById("openChrome").classList.add("hide");
  }
}
// 음성 목록이 늦게 채워지므로 몇 번 재확인
[400, 1200, 2500].forEach(t => setTimeout(()=>{ if(!document.getElementById("start").classList.contains("hide")) checkBrowser(); }, t));

/* 발음 테스트 — 이 폰에서 영어 TTS가 되는지 진단 */
function testTTS(){
  const out = document.getElementById("ttsOut");
  out.className = "";
  if(!('speechSynthesis' in window)){
    out.className = "bad";
    out.textContent = "❌ 이 브라우저는 발음 기능이 없어.\n크롬으로 열어봐.";
    return;
  }
  pickVoice();
  const total = (speechSynthesis.getVoices() || []).length;
  out.textContent = "🔎 확인 중… (음성 " + total + "개 / 영어 " + enVoices.length + "개)";

  if(enVoices.length === 0){
    out.className = "bad";
    out.textContent =
      "❌ 이 폰에 영어 음성이 없어 (전체 음성 " + total + "개)\n" +
      "갤럭시: 설정 → 접근성 → 시청각 보조 →\n텍스트 음성 변환 → 기본 엔진을 'Google 음성인식 및 합성'으로\n바꾸고 언어에서 English 다운로드";
    return;
  }

  let started = false;
  const u = new SpeechSynthesisUtterance("apple");
  u.lang = (enVoice && enVoice.lang) || "en-US";
  u.rate = .8;
  if(enVoice) u.voice = enVoice;
  u.onstart = ()=>{
    started = true; ttsWorked = true;
    out.className = "good";
    out.textContent = "✅ 발음 나온다!\n사용 중인 음성: " + (enVoice ? enVoice.name + " (" + enVoice.lang + ")" : "기본");
  };
  u.onerror = (e)=>{
    out.className = "bad";
    out.textContent = "❌ 발음 실패 (" + (e.error || "unknown") + ")\n소리(🔊) 켜져 있는지, 미디어 볼륨 확인해봐";
  };
  speechSynthesis.cancel();
  setTimeout(()=>{
    speechSynthesis.speak(u);
    setTimeout(()=>{
      if(!started){
        out.className = "bad";
        out.textContent =
          "❌ 영어 음성은 " + enVoices.length + "개 있는데 소리가 안 나\n" +
          "① 미디어 볼륨 올리기 ② 무음/방해금지 끄기\n③ 설정 → 접근성 → 텍스트 음성 변환에서\n   엔진을 Google로 바꾸고 English 설치";
      }
    }, 1800);
  }, 60);
}

function showSay(en, ko){
  const box = document.getElementById("say");
  box.classList.remove("warn");
  box.querySelector(".en").textContent = "🔊 " + en;
  box.querySelector(".sp").textContent = " = " + ko;
  box.classList.add("on");
}

/* ================= 결과 ================= */
function finish(){
  const s = STAGES[cur], pairs = s.words.length;
  let stars = 1;
  if(tries <= Math.ceil(pairs*1.5)) stars = 3;
  else if(tries <= Math.ceil(pairs*2.3)) stars = 2;

  if((save.stars[cur]||0) < stars){ save.stars[cur] = stars; persist(); }
  else if(!(cur in save.stars)){ save.stars[cur] = stars; persist(); }

  sfxClear();
  fireworks(2);                                   // 클리어 축하 폭죽
  setTimeout(()=>fireworks(2), 700);
  document.getElementById("rTitle").textContent = (cur+1)+"단계 클리어!";
  document.getElementById("rStars").textContent = "⭐".repeat(stars) + "☆".repeat(3-stars);
  const pool = stars === 3 ? CHEER_GOOD : CHEER_OK;
  document.getElementById("rMsg").textContent =
    "뒤집기 " + tries + "번 · 최고 " + bestCombo + "연속 🔥\n" +
    pool[Math.floor(Math.random()*pool.length)];

  const wl = document.getElementById("rWords");
  wl.innerHTML = "";
  s.words.forEach(w=>{
    const r = document.createElement("div");
    r.className = "wrow";
    r.innerHTML = '<span class="ws">🔊</span><span class="we">'+w[0]+'</span><span class="wk">'+w[1]+'</span>';
    r.onclick = ()=>speak(w[0], .8);
    wl.appendChild(r);
  });

  document.getElementById("nextBtn").classList.toggle("hide", cur >= STAGES.length-1);
  show("result");
}

function nextStage(){
  if(cur < STAGES.length-1) startStage(cur+1);
  else goHome();
}

renderHome();
</script>
