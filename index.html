<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>이음 검정고시 퀘스트 🎓</title>
<style>
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  body{
    font-family:'Segoe UI','Malgun Gothic',system-ui,sans-serif;
    background:#fff; color:#3c3c3c; min-height:100vh; min-height:100dvh;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .box{width:100%; max-width:340px; text-align:center;}
  .cap{font-size:64px; margin-bottom:10px; animation:bob 2s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  h1{font-size:22px; color:#4aa802; margin-bottom:6px;}
  .sub{font-size:13px; color:#afafaf; line-height:1.6; margin-bottom:20px;}
  input{
    width:100%; border:3px solid #e5e5e5; border-radius:16px; padding:15px;
    font-size:19px; text-align:center; font-weight:800; outline:none;
    font-family:inherit; letter-spacing:2px;
  }
  input:focus{border-color:#1cb0f6;}
  button{
    width:100%; margin-top:11px; border:none; border-radius:16px; background:#58cc02;
    color:#fff; font-size:18px; font-weight:800; padding:15px; cursor:pointer;
    box-shadow:0 4px 0 #4aa802; font-family:inherit;
  }
  button:active{transform:translateY(3px); box-shadow:0 1px 0 #4aa802;}
  button:disabled{background:#e5e5e5; color:#afafaf; box-shadow:0 4px 0 #d0d0d0;}
  .msg{margin-top:13px; font-size:14px; font-weight:800; min-height:20px;}
  .msg.err{color:#ff4b4b;}
  .msg.ok{color:#4aa802;}
  .keep{margin-top:14px; font-size:13px; color:#afafaf; font-weight:700; user-select:none;}
  .keep input{width:auto; margin-right:6px; transform:scale(1.3); vertical-align:middle;}
</style>
</head>
<body>
<div class="box">
  <div class="cap">🔐</div>
  <h1>이음 검정고시 퀘스트</h1>
  <div class="sub">이음이만 볼 수 있어.<br>비밀번호를 넣어줘.</div>
  <input id="pw" type="password" inputmode="text" autocomplete="current-password" placeholder="비밀번호">
  <button id="go">들어가기</button>
  <label class="keep"><input type="checkbox" id="keep" checked>이 폰에서는 다음부터 바로 열기</label>
  <div class="msg" id="msg"></div>
</div>

const SALT = "Bebc9dZvmZkD1oel1S98ag==";
const IV   = "nWQXbEN9c/+Dwx81";
const ITER = 150000;
const KEY_STORE = 'gq_pw';

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const $ = id => document.getElementById(id);

async function unlock(pw, quiet){
  const msg = $('msg');
  if(!quiet){ msg.className='msg'; msg.textContent='여는 중… ⏳'; $('go').disabled = true; }
  try{
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const aes  = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt:b64(SALT), iterations:ITER, hash:'SHA-256'},
      base, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(IV)}, aes, b64(PAYLOAD));
    const html = new TextDecoder().decode(plain);

    if($('keep').checked){ try{ localStorage.setItem(KEY_STORE, pw); }catch(e){} }
    document.open(); document.write(html); document.close();
    return true;
  }catch(e){
    try{ localStorage.removeItem(KEY_STORE); }catch(e2){}
    if(!quiet){
      msg.className='msg err';
      msg.textContent='비밀번호가 달라 😢 다시 해볼래?';
      $('go').disabled = false; $('pw').value=''; $('pw').focus();
    }
    return false;
  }
}

$('go').onclick = ()=>{ const v=$('pw').value.trim(); if(v) unlock(v, false); };
$('pw').addEventListener('keydown', e=>{ if(e.key==='Enter') $('go').click(); });

// 이 폰에서 전에 성공했으면 바로 입장
(async ()=>{
  let saved = null;
  try{ saved = localStorage.getItem(KEY_STORE); }catch(e){}
  if(saved) await unlock(saved, true);
  $('pw').focus();
})();
</script>
