    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .box{width:100%; max-width:340px; text-align:center;}
  .cap{font-size:64px; margin-bottom:10px; animation:bob 2s ease-in-out infinite;}

  .sub{font-size:13px; color:#afafaf; line-height:1.6; margin-bottom:20px;}
  input{

    font-size:19px; text-align:center; font-weight:800; outline:none;
    font-family:inherit; letter-spacing:2px;
  }
  input:focus{border-color:#1cb0f6;}
  button{
    width:100%; margin-top:11px; border:none; border-radius:16px; background:#58cc02;
    color:#fff; font-size:18px; font-weight:800; padding:15px; cursor:pointer;
    box-shadow:0 4px 0 #4aa802; font-family:inherit;
  }
  button:active{transform:translateY(3px); box-shadow:0 1px 0 #4aa802;}
  button:disabled{background:#e5e5e5; color:#afafaf; box-shadow:0 4px 0 #d0d0d0;}
  .msg{margin-top:13px; font-size:14px; font-weight:800; min-height:20px;}
  .msg.err{color:#ff4b4b;}
  .msg.ok{color:#4aa802;}
  .keep{margin-top:14px; font-size:13px; color:#afafaf; font-weight:700; user-select:none;}
  .keep input{width:auto; margin-right:6px; transform:scale(1.3); vertical-align:middle;}
  .ver{margin-top:22px; font-size:12px; color:#d5d5da; font-weight:700; letter-spacing:.5px;}

  var SALT = "pX5MtLntEqWAcIRCxG8QWw==";
  var IV   = "nUPWvxrOa3UVIfNS";
  var ITER = 150000;
  var KEY_STORE = 'gq_pw';

  var b64 = function(s){ return Uint8Array.from(atob(s), function(c){ return c.charCodeAt(0); }); };
  var el  = function(id){ return document.getElementById(id); };

  async function unlock(pw, quiet){
    var m = el('msg');
    if(!quiet){ m.className='msg'; m.textContent='여는 중… ⏳'; el('go').disabled = true; }
    try{
      var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
      var aes  = await crypto.subtle.deriveKey(
        {name:'PBKDF2', salt:b64(SALT), iterations:ITER, hash:'SHA-256'},
        base, {name:'AES-GCM', length:256}, false, ['decrypt']);
      var plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(IV)}, aes, b64(PAYLOAD));
      var doc = new TextDecoder().decode(plain);

      if(el('keep').checked){ try{ localStorage.setItem(KEY_STORE, pw); }catch(e){} }
      document.open(); document.write(doc); document.close();
      return true;
    }catch(e){
      try{ localStorage.removeItem(KEY_STORE); }catch(e2){}
      if(!quiet){
        m.className='msg err';
        m.textContent='비밀번호가 달라 😢 다시 해볼래?';
        el('go').disabled = false; el('pw').value=''; el('pw').focus();
      }
      return false;
    }
  }

  el('go').onclick = function(){ var v = el('pw').value.trim(); if(v) unlock(v, false); };
  el('pw').addEventListener('keydown', function(e){ if(e.key==='Enter') el('go').click(); });

  // 이 폰에서 전에 성공했으면 바로 입장
  (async function(){
    var saved = null;
    try{ saved = localStorage.getItem(KEY_STORE); }catch(e){}
    if(saved) await unlock(saved, true);
    el('pw').focus();
  })();
})();
